<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extractor de Incapacidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center justify-center p-4">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-4xl">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Subir Incapacidades</h1>
        
        <div class="mb-4">
            <!-- Se agrego el atributo multiple -->
            <input type="file" id="fileInput" accept="application/pdf" multiple class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <button id="uploadBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:bg-gray-400" disabled>Procesar PDFs</button>

        <div id="resultados" class="mt-6 hidden">
            <h2 class="text-lg font-semibold mb-2">Registros Procesados:</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="py-2 px-4 border text-left">Nombre</th>
                            <th class="py-2 px-4 border text-left">Cédula</th>
                            <th class="py-2 px-4 border text-left">EPS</th>
                            <th class="py-2 px-4 border text-left">Inicio</th>
                            <th class="py-2 px-4 border text-left">Fin</th>
                            <th class="py-2 px-4 border text-left">Días</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo"></tbody>
                </table>
            </div>
        </div>

        <div class="mt-8 border-t pt-6">
            <a id="downloadBtn" href="#" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 inline-block opacity-50 pointer-events-none">Descargar Excel</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
